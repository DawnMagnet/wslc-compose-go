# Push a tag like v0.2.0 to build every platform and publish a GitHub Release.
# Notes come from docs/release-notes/<tag>.md when present.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...
      - run: make dist VERSION=${{ github.ref_name }}
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="docs/release-notes/$TAG.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          elif [ -f "$notes" ]; then
            gh release create "$TAG" dist/* --title "$TAG" --notes-file "$notes" --verify-tag
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag
          fi
