# Multiple networks, per-endpoint addresses and IPAM.
name: nets
services:
  app:
    image: alpine
    networks:
      back:
        priority: 100
        ipv4_address: 172.28.1.10
        aliases: [db]
      front:
        ipv4_address: 172.28.0.10
        aliases: [www]
        link_local_ips: ["169.254.1.10"]
        driver_opts:
          com.docker.network.endpoint.foo: bar
  edge:
    image: alpine
    networks: [ext]
networks:
  back:
    internal: true
    driver_opts:
      com.docker.network.bridge.name: br-back
    ipam:
      config:
        - subnet: 172.28.1.0/24
          gateway: 172.28.1.1
          ip_range: 172.28.1.128/25
  front:
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
  ext:
    external: true
    name: already
