# File, environment and content sources, plus an external secret.
name: sec
services:
  app:
    image: alpine
    build:
      context: ./web
      secrets:
        - source: token
          target: tok
    secrets:
      - token
      - source: api_key
        target: api_key
        mode: "0440"
    configs:
      - source: app_cfg
        target: /etc/app/config.yml
      - source: inline
        target: inline.cfg
  ext:
    image: busybox
    secrets:
      - source: outside
        uid: "1000"
        gid: "1000"
secrets:
  token:
    file: ./api.env
  api_key:
    environment: API_KEY
  outside:
    external: true
configs:
  app_cfg:
    file: ./api.env
  inline:
    content: "hello-config\n"
